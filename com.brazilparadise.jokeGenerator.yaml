app-id: com.diboua.jokeGenerator
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'

command: run.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri

modules:
  - name: diboua-jokeGenerator
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/diboua
      - cp -r * /app/opt/diboua/
      - mkdir -p /app/bin
      - cat > /app/bin/run.sh << 'EOF'
#!/bin/bash
exec xdg-open "https://www.diboua.com"
EOF
      - chmod +x /app/bin/run.sh
    sources:
      - type: git
        url: https://github.com/BrazilParadise/flathub-diboua.com-jokeGenerator.git
        branch: main

  - name: metainfo
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/metainfo
      - cp com.diboua.jokeGenerator.metainfo.xml /app/share/metainfo/
      - mkdir -p /app/share/applications
      - cp com.diboua.jokeGenerator.desktop /app/share/applications/
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - cp icon.png /app/share/icons/hicolor/512x512/apps/com.diboua.jokeGenerator.png
    sources:
      - type: file
        path: com.diboua.jokeGenerator.metainfo.xml
      - type: file
        path: com.diboua.jokeGenerator.desktop
      - type: file
        path: icon.png
