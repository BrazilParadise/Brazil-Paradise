app-id: com.brazilparadise.JokeGenerator
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: start-app.sh

modules:
  - name: joke-generator
    buildsystem: simple
    build-commands:
      - npm install --prefix=/app/joke-generator
      - npm run build --prefix=/app/joke-generator 2>/dev/null || true
    install-commands:
      - mkdir -p /app/joke-generator
      - cp -r . /app/joke-generator
      - cp start-app.sh /app/bin/
      - chmod +x /app/bin/start-app.sh
      - mkdir -p /app/share/applications
      - cp com.brazilparadise.JokeGenerator.desktop /app/share/applications/
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - cp icon.png /app/share/icons/hicolor/256x256/apps/com.brazilparadise.JokeGenerator.png
    sources:
      - type: dir
        path: .
      - type: file
        path: start-app.sh
        dest-filename: start-app.sh
      - type: file
        path: com.brazilparadise.JokeGenerator.desktop
        dest-filename: com.brazilparadise.JokeGenerator.desktop

finish-args:
  - --socket=network
  - --share=network
  - --device=dri

metadata:
  X-Repodata-URI: https://github.com/BrazilParadise/Brazil-Paradise
